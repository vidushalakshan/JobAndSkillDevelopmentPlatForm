spring.application.name=JobAndSkillDevelopment
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/jobs?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT secret key
security.jwt.secret-key =${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.config.import=optional:file:../.env[.properties]

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}

# LangChain4j Gemini AI
langchain4j.googleai.gemini.api-key=${GEMINI_API_KEY}
langchain4j.googleai.gemini.model-name=gemini-2.5-flash
langchain4j.googleai.gemini.log-requests=true
langchain4j.googleai.gemini.log-responses=true
